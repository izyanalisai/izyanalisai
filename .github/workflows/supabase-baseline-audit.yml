name: Izy Supabase Baseline Security Inventory
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/audit-supabase-baseline*'
      - '.github/workflows/supabase-baseline-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test baseline privilege scanner
        run: node --test scripts/audit-supabase-baseline.test.mjs
      - name: Inventory baseline risks before any live migration
        run: node scripts/audit-supabase-baseline.mjs | tee baseline-security-inventory.json
      - name: Preserve review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: izy-baseline-security-inventory
          path: baseline-security-inventory.json
          retention-days: 14
