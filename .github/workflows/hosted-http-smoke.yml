name: Izy Hosted HTTP Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live HTTPS anonymous browsing and protected account boundaries
        run: |
          python - <<'PY'
          import json
          import ssl
          import urllib.error
          import urllib.request

          origin = "https://izyanalisai-production.up.railway.app"
          context = ssl.create_default_context()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=context), NoRedirect()
          )

          def fetch(path):
              request = urllib.request.Request(
                  origin + path,
                  headers={"User-Agent": "Izy-Public-Access-Verification/1.0",
                           "Accept": "text/html"}, method="GET"
              )
              try:
                  response = opener.open(request, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  body = response.read(65537)
                  if len(body) > 65536:
                      raise AssertionError("Public response exceeds smoke-test budget")
                  return response.status, response.headers, body

          for path in ("/", "/landing", "/splash", "/onboarding"):
              status, headers, body = fetch(path)
              assert status == 200, f"Public {path} blocked: HTTP {status}"
              assert headers.get("Content-Type", "").lower().startswith("text/html"), path
              assert len(body) >= 128, f"Public {path} returned an empty page"
              assert not headers.get("Location"), f"Public {path} unexpectedly redirected"

          # The anonymous marketing/market experience must not disable personal-data
          # authorization. Refuse to silently follow redirects and accept no 200.
          status, headers, _ = fetch("/profil")
          assert status in (301, 302, 303, 307, 308, 401, 403), (
              f"Anonymous account profile unexpectedly accessible: HTTP {status}"
          )
          if 300 <= status < 400:
              location = headers.get("Location", "")
              assert location.startswith("/landing") or location.startswith(origin + "/landing"), (
                  "Private profile redirected to an unexpected destination"
              )
          print(json.dumps({
              "origin": origin,
              "anonymous_public_pages": ["homepage", "landing", "splash", "onboarding"],
              "private_profile": "DENIED",
              "scope": "Real anonymous HTTP navigation only; market data, paid APIs, auth sessions, and Supabase migration not verified"
          }))
          PY
